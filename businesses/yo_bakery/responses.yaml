# --- Booking Fallbacks (per-step, context-aware) ---
fallback_service_selection: |
  🤔 **I didn't understand your selection**
  
  **Right now I'm waiting for you to choose a service.**
  
  💡 **Try one of these:**
  - Type a **number** (1, 2, 3...)
  - Type the **service name** exactly
  - Type `show services` to see options again
  - Type `help` for detailed guidance
  - Type `cancel` to exit booking

fallback_party_size: |
  🤔 **I need to know your party size**
  
  **Please enter a number** (e.g., 2, 4, 6)
  
  💡 **Examples:**
  - "2" for 2 people
  - "4 guests"
  - "party of 6"

fallback_topic: |
  🤔 **What topic would you like to discuss?**
  
  **Please describe your consultation topic**
  
  💡 **Examples:**
  - "Wedding cake design"
  - "Dietary restrictions"
  - "Custom cake order"

fallback_datetime_selection: |
  🤔 **I need your preferred date and time**
  
  **Please use format:** YYYY-MM-DD HH:MM
  
  **Examples:**
  - "2024-01-15 14:30"
  - "Tomorrow 10:00 AM"
  - "Next Friday at 3 PM"
  
  💡 **Need help?** Type `help` for detailed time format guidance

fallback_name_collection: |
  🤔 **I need your name for the booking**
  
  **Please enter your full name**
  
  💡 **Examples:**
  - "John Smith"
  - "Jane Doe"
  - Just type your name as you'd like it to appear

fallback_special_requests: |
  🤔 **Any special requests?**
  
  **Please describe any special needs or type `none` to skip**
  
  💡 **Examples:**
  - "Gluten-free options needed"
  - "Birthday message on cake"
  - "Allergy to nuts"
  - "none" (to skip)

fallback_confirmation: |
  🤔 **I didn't understand your confirmation**
  
  **Please reply with:**
  - `yes` or `confirm` to book your appointment
  - `no` or `cancel` to cancel the booking
  
  💡 **Need to review?** Type `show booking` to see your details again

general_fallback: |
  🤔 **I'm not sure what you'd like to do**
  
  **You can always:**
  - Type `help` for guidance
  - Type `back` to go to previous step
  - Type `restart` to start over
  - Type `cancel` to exit booking
  - Type `show options` to see current choices
  
  💡 **Stuck?** Contact us at {contact_phone} for immediate assistance

