  {is_open_now}

intent_contact: |
  📞 **Contact Us:**
  
  **Phone:** (555) 123-BAKE (2253)
  **Email:** hello@{business_name}.com
  **Hours:** {business_hours}
  
  **Social Media:**
  - Instagram: @{business_name}
  - Facebook: /{business_name}
  
