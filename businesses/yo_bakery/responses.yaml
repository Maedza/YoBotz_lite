# --- Greetings & Goodbyes ---
intent_greeting: "Hi there! Welcome to **{business_name}**! Ready to explore products, check your cart, or get help? Just tell me what you’d like to do—or type **quit** anytime to exit."

intent_goodbye: "Thank you for visiting {business_name}! See you around, come buy anytime!🤗"

intent_thanks: "You're welcome! If you need anything else, just let me know."

# --- Help & Fallback (shared) ---
intent_help: |
  🆘 **{business_name} Help Center**
  
  **I can help you with:**
  
  🛒 **ORDERING & PRODUCTS**
  - `buy` or `show products` – Browse our menu
  - `search [name]` – Find a specific product fast
  - `view cart` – See what's in your cart
  - `add [product]` – Add items to cart
  - `edit cart` – Remove or change quantities
  - `confirm order` – Finalize your purchase
  
  📅 **BOOKING SYSTEM**
  - `book` or `make appointment` – Start a new booking
  - `my bookings` – View your upcoming appointments
  - `cancel booking` – Cancel an existing booking
  
  ℹ️ **BUSINESS INFO**
  - `hours` – Our opening hours
  - `location` – Find our store
  - `contact` – Get in touch
  - `about` – Learn our story
  - `faq` – Common questions
  
  🔄 **SESSION CONTROL**
  - `quit` or `exit` – End current flow & start fresh
  - `back` – Go to previous step
  - `help` – Show this message again
  
  🤖 **BOT INFO**
  - `are you human?` – Learn about me

  💡 **Quick Tips:**
  - I can remember your cart between messages
  - Bookings can be made for future dates only
  - You can edit your cart anytime before confirming
  
  **Need something specific?** Just ask! I'm here to make your experience at {business_name} smooth and enjoyable. 😊

intent_fallback: |
  **Let me help you get to the right place!**
  
  **I think you might be looking for:**
  
  🛒 **ORDERING & PRODUCTS**
  - "show products" or "buy"
  - "search chocolate cake" or "find croissant"
  - "what's in my cart?"
  - "add chocolate cake"
  
  📅 **BOOKINGS & APPOINTMENTS**  
  - "make a booking"
  - "view my bookings"
  - "cancel booking"
  
  ℹ️ **INFORMATION**
  - "hours" or "open now?"
  - "location" or "address"
  - "contact" or "phone number"
  - "about" or "your story"
  
  **💡 Quick Fixes:**
  1. Be more specific (e.g., "book a cake tasting" or "book" in short)
  2. Use keywords from the list above
  3. Type `help` for complete guide
  
  **Example:** "I want to order" → "Can I see your pastry menu?"

fallback: "Hello! How can I help you today?"

error_fallback: "⚠️ Something went wrong. Try again or type 'view cart' to check your cart."

