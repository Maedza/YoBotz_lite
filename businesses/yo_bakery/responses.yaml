intent_about: |
  🏆 **Our Story:**
  
  Founded in 2015, **{business_name}** started as a home kitchen passion project and grew into the community's favorite artisanal bakery.
  
  **✨ What Makes Us Special:**
  • **Family-Owned** – Every batch made with care
  • **100% Natural** – No artificial ingredients
  • **Daily Fresh** – Baked morning of sale
  • **Custom Everything** – Your vision, our creation
  
  **👨‍🍳 Meet Maria:** Head baker with 20+ years experience, trained in Paris & Tokyo.
  
  **🌟 Community Love:** Voted "Best Bakery" 3 years running!

intent_faq: |
  **Common Questions:**
  
  **Q: How far in advance should I order?**
  A: 24 hours for daily items, 48+ hours for custom cakes, 1+ week for weddings/events.
  
  **Q: Do you accommodate dietary restrictions?**
  A: Yes! Gluten-free, vegan, nut-free options available. Please mention when ordering.
  
  **Q: What's your cancellation policy?**
  A: Full refund with 24+ hour notice. 50% refund within 24 hours. No refund for same-day cancellations.
  
  **Q: Can I modify my order after placing it?**
  A: Changes allowed up to 24 hours before pickup/delivery. Last-minute changes may incur fees.
  
  **Q: Do you offer payment plans for large orders?**
  A: Yes! 50% deposit to book, balance due 1 week before event.
  
  💡 **More questions?** Just ask or say **contact** to reach our team directly!

intent_human_check: |
  **Great question!**
  
  I'm **{business_name}'s AI assistant** - a smart chatbot powered by artificial intelligence! 
  
  **What I am:**
  ✅ **Always available** - 24/7, no breaks!
  ✅ **Lightning fast** - Instant responses
  ✅ **Multitasking master** - Help multiple customers at once
  ✅ **Never forgets** - Remember your preferences
  ✅ **Consistently cheerful** - Same great service every time
  
  **What I can do:**
  • Answer questions about our business
  • Help you book appointments  
  • Assist with orders and products
  • Provide information instantly
  
  **When you might want a human:**
  • Complex custom requests
  • Emergency situations
  • Billing/account issues
  
  **💡 Pro tip:** I'm actually pretty good! Try me with "book", "hours", or "pricing"!
  
  **So... AI or human?** I'm your friendly AI helper! How can I assist you today? 😊


